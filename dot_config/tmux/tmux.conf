# Make tmux's command key like screen.
set-option -g prefix C-a
unbind-key C-b
bind-key a send-prefix # C-a a sends literal 'C-a'

bind-key C-n next-window
bind-key C-p previous-window

bind-key k select-pane -U
bind-key C-k select-pane -U
bind-key j select-pane -D
bind-key C-j select-pane -D
bind-key Escape copy-mode

set-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

bind-key Tab last-window
bind-key C-a select-pane -t :.+

bind-key A command-prompt "rename-window %%"

# Start windows from 1, 0 is the far end of the keyboard
set-option -g base-index 1
set-option -g renumber-windows on

bind-key / command-prompt "find-window %1"

# Don't set the window name, I'll be doing it.
set-option -g set-titles on
set-option -g set-titles-string '#S'

set-option -g status on        # status bar
set-option -g bell-action any
set-option -g visual-bell off  # visual bells are worse

# Increase scrollback buffer
set-option -g history-limit 100000

# Ghostty: truecolor, colored/curly underlines (LSP squiggles), OSC52 clipboard, OSC8 links
set-option -g default-terminal 'tmux-256color'
set-option -ga terminal-features ',xterm-ghostty:RGB:usstyle:hyperlinks:clipboard'

# Let Kitty-graphics-protocol image escapes (yazi, chafa, icat) reach Ghostty
set-option -g allow-passthrough on

# Copy-mode yank goes to system clipboard via OSC52
set-option -s set-clipboard on

# Stop the statusbar being fluorescent green
set-option -g status-style fg=white,bg=default
set-window-option -g window-status-current-style fg=blue,bg=default,bold
set-window-option -g window-status-current-format '« #I:#W »'
set-option -g status-right-length 50
set-option -g status-left-length 50
set-option -g status-left "#[fg=yellow]#h:[#S] "
set-option -g status-right "#{prefix_highlight}#[fg=yellow]%a %d-%h %H:%M"

# Make active border red, it defaults to green which isn't very subtle
set-option -g pane-border-style fg=white
set-option -g pane-active-border-style fg=red

# Mouse support: click to select pane/window, drag to resize, scroll to copy-mode
set-option -g mouse on

# Easy reload without restarting tmux
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

set-option -s escape-time 0        # address vim mode switching delay
set-option -g display-time 4000    # tmux messages displayed for 4 seconds
set-option -g status-interval 5    # refresh status-left/status-right more often
set-option -g status-keys emacs    # emacs keys in command prompt, even for vim users
set-option -g focus-events on      # focus events for terminals that support them
set-window-option -g aggressive-resize on  # useful for grouped sessions / multi-monitor

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
set -g @tpm_plugins "              \
  tmux-plugins/tpm                 \
  christoomey/vim-tmux-navigator   \
  sainnhe/tmux-fzf                 \
  tmux-plugins/tmux-prefix-highlight \
"

run '~/.local/share/tmux/plugins/tpm/tpm'
run-shell -b '~/.local/share/tmux/plugins/tpm/bin/install_plugins'
