format = "$directory$vcs$aws$character"
command_timeout = 1000

[vcs]
order = ["jj", "git"]
jj_modules = "$jj_bookmark$jj_status$jj_metrics"
git_modules = "$git_branch$git_status"

[directory]
style = "blue"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style)) "

[aws]
symbol = "☁️  "
style = "cyan"
format = "[$symbol$profile]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
