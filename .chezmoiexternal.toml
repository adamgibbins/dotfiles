[".config/nvim"]
    type = "git-repo"
    url = "https://github.com/adamgibbins/neovim-config.git"
    refreshPeriod = "168h"
    [".config/nvim".clone]
        args = ["--config", "remote.origin.pushurl=git@github.com:adamgibbins/neovim-config.git"]
    [".config/nvim".pull]
        args = ["--ff-only"]

[".hammerspoon"]
    type = "git-repo"
